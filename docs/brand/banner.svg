<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-label="EventFlow: events people actually show up for">
  <defs>
    <radialGradient id="glow" cx="0.85" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#A66BFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#A66BFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <clipPath id="frame"><rect width="1280" height="440" rx="28"/></clipPath>
    <style>
      .d { font-family: "Bricolage Grotesque", "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-weight: 800; }
      .m { font-family: "IBM Plex Mono", Consolas, "SF Mono", monospace; }
      .run { animation: run 18s linear infinite; }
      .run2 { animation: run 24s linear infinite reverse; }
      .spin { transform-origin: 1110px 120px; animation: spin 14s linear infinite; }
      .ping { transform-origin: 96px 92px; animation: ping 1.8s ease-out infinite; }
      @keyframes run { from { transform: translateX(0); } to { transform: translateX(-640px); } }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes ping { 0% { transform: scale(1); opacity: .8; } 100% { transform: scale(3); opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .run, .run2, .spin, .ping { animation: none; } }
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="440" fill="#171717"/>
    <rect width="1280" height="440" fill="url(#grid)"/>
    <rect width="1280" height="440" fill="url(#glow)"/>

    <!-- logo + badge -->
    <rect x="64" y="64" width="44" height="44" rx="12" fill="#FFF21A" transform="rotate(-6 86 86)"/>
    <path d="M76 79h20v14H76z M80 75v4 M92 75v4" stroke="#171717" stroke-width="3.2" fill="none" stroke-linecap="round" transform="rotate(-6 86 86)"/>
    <text x="124" y="97" class="d" font-size="30" fill="#ffffff" textLength="146" lengthAdjust="spacingAndGlyphs">EventFlow</text>

    <!-- headline -->
    <text x="64" y="210" class="d" font-size="76" fill="#ffffff" textLength="500" lengthAdjust="spacingAndGlyphs">Events people</text>
    <g transform="rotate(-1.5 330 262)">
      <rect x="58" y="222" width="532" height="78" rx="8" fill="#FFF21A"/>
    </g>
    <text x="70" y="288" class="d" font-size="76" fill="#171717" textLength="508" lengthAdjust="spacingAndGlyphs">actually show up</text>
    <text x="606" y="288" class="d" font-size="76" fill="none" stroke="#A66BFF" stroke-width="2" textLength="118" lengthAdjust="spacingAndGlyphs">for.</text>

    <!-- spinning ring sticker -->
    <g class="spin">
      <circle cx="1110" cy="120" r="70" fill="none" stroke="#A66BFF" stroke-width="1.5" stroke-dasharray="4 7"/>
      <path id="ring" d="M1110,120 m-54,0 a54,54 0 1,1 108,0 a54,54 0 1,1 -108,0" fill="none"/>
      <text class="m" font-size="10.5" fill="#FFF21A" letter-spacing="1.6"><textPath href="#ring">REGISTER · SCAN · CHECK IN · CERTIFY ·</textPath></text>
    </g>
    <circle cx="1110" cy="120" r="26" fill="#FFF21A"/>
    <path d="M1099 120l8 8 15-16" stroke="#171717" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- ticket stub -->
    <g transform="rotate(4 1030 290)">
      <rect x="880" y="236" width="300" height="104" rx="14" fill="#ffffff"/>
      <rect x="1100" y="236" width="80" height="104" fill="#FFF21A"/>
      <rect x="1100" y="236" width="80" height="104" rx="14" fill="#FFF21A"/>
      <line x1="1100" y1="244" x2="1100" y2="332" stroke="#171717" stroke-opacity=".35" stroke-width="2" stroke-dasharray="5 5"/>
      <text x="900" y="264" class="m" font-size="11" fill="#5F5F66" letter-spacing="2">ADMIT ONE · DAY PASS</text>
      <text x="900" y="298" class="d" font-size="26" fill="#171717" textLength="140" lengthAdjust="spacingAndGlyphs">Utsav 2026</text>
      <text x="900" y="322" class="m" font-size="12" fill="#171717">12 DEC · CENTRAL LAWNS</text>
      <g fill="#171717">
        <rect x="1116" y="258" width="16" height="16"/><rect x="1148" y="258" width="16" height="16"/>
        <rect x="1116" y="302" width="16" height="16"/><rect x="1138" y="282" width="8" height="8"/>
        <rect x="1152" y="296" width="8" height="8"/><rect x="1152" y="310" width="12" height="8"/>
      </g>
    </g>

    <!-- marquee bands -->
    <g transform="rotate(-2 640 392)">
      <rect x="-40" y="366" width="1360" height="44" fill="#FFF21A"/>
      <g class="run">
        <text x="0" y="396" class="d" font-size="22" fill="#171717" letter-spacing="-0.5">QR TICKETS ✶ OFFLINE TICKETS ✶ ONE-TAP REFUNDS ✶ CERTIFICATES ✶ QR TICKETS ✶ OFFLINE TICKETS ✶ ONE-TAP REFUNDS ✶ CERTIFICATES ✶ QR TICKETS ✶ OFFLINE TICKETS ✶ ONE-TAP REFUNDS ✶ CERTIFICATES ✶</text>
      </g>
    </g>
    <g transform="rotate(1.5 640 430)" opacity=".95">
      <rect x="-40" y="412" width="1360" height="34" fill="#A66BFF"/>
      <g class="run2">
        <text x="-640" y="435" class="m" font-size="14" fill="#171717" letter-spacing="2">MULTI-TENANT · 9 ROLES · RAZORPAY · WEBSITE BUILDER · PWA · MULTI-TENANT · 9 ROLES · RAZORPAY · WEBSITE BUILDER · PWA · MULTI-TENANT · 9 ROLES · RAZORPAY · WEBSITE BUILDER · PWA · MULTI-TENANT · 9 ROLES · RAZORPAY ·</text>
      </g>
    </g>
  </g>
</svg>
